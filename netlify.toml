[build]
  command = "npm run build"
  environment = { NODE_VERSION = "20" }
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/portal/*"
  [headers.values]
    X-Robots-Tag = "noindex"
